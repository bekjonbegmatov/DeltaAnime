name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Tests and frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/player-settings.test.mjs
      - run: npm run build
  docker:
    name: Docker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 120
      - run: python3 scripts/smoke.py http://127.0.0.1:8080
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Cleanup
        if: always()
        run: docker compose down --volumes
